<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Random Hiragana</title>
    <style>
        #words {
            font-size: 100px;
        }
    </style>
</head>
<body>
    <div id="words"></div>

    <script>
        const hiragana = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん";

        const words = [];

        for (let j = 0; j < 3; j++) {
            let word = "";

            for (let i = 0; i < 3; i++) {
                const index = Math.floor(Math.random() * hiragana.length);
                word += hiragana[index];
            }

            words.push(word);
        }

        document.getElementById("words").innerHTML = words.join("<br><br>");
    </script>
</body>
</html>
